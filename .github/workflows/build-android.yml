name: Build & Release Raketa

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Configure git — HTTPS instead of SSH
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go 1.24.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973"    >> $GITHUB_ENV

      - name: Setup Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.8'
          cache: true

      # Use repository secret KEYSTORE_BASE64 if available, otherwise generate ephemeral key.
      # For production release: add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # as repository secrets in Settings → Secrets and variables → Actions.
      - name: Setup release keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "Using production keystore from secrets"
          else
            keytool -genkeypair \
              -v \
              -keystore android/app/keystore.jks \
              -alias flclashr \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Raketa, OU=Dev, O=Raketa, L=Moscow, S=Moscow, C=RU"
            echo "Using ephemeral keystore (for CI testing only)"
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build native Clash core (Go → .so)
        run: dart setup.dart android --out core
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK }}

      - name: Generate Dart code (freezed / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK — arm64-v8a
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Build APK — universal
        run: flutter build apk --release

      - name: Rename APKs with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/Raketa-${VERSION}-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Raketa-${VERSION}-universal.apk
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Built version: $VERSION"

      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Raketa-arm64-release
          path: build/app/outputs/flutter-apk/Raketa-*-arm64.apk
          retention-days: 30

      - name: Upload universal APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Raketa-universal-release
          path: build/app/outputs/flutter-apk/Raketa-*-universal.apk
          retention-days: 30

      # Creates a GitHub Release when:
      # - A tag like v1.0.0 is pushed, OR
      # - workflow_dispatch with release=true
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Raketa ${{ env.VERSION }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/Raketa-*-arm64.apk
            build/app/outputs/flutter-apk/Raketa-*-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
