name: Build & Release Raketa APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.1.1)'
        required: true
        default: '1.1.1'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Bug fixes and improvements'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.0'
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: android-actions/setup-android@v3

      - name: Install NDK 27.0.12077973
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Restore persistent keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
          echo "STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Bump version in pubspec.yaml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Build number = major*10000 + minor*100 + patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          BUILD=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          sed -i "s/^version:.*/version: ${VERSION}+${BUILD}/" pubspec.yaml
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Set version to ${VERSION}+${BUILD}"

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Dart code (freezed / riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Go core (.so)
        run: dart setup.dart android --out core
        env:
          ANDROID_NDK: ${{ env.ANDROID_NDK }}

      - name: Build APK (arm64)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/Raketa-${{ env.VERSION }}.apk

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ env.VERSION }}" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Raketa v${{ env.VERSION }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/Raketa-${{ env.VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
